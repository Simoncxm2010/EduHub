name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装后端依赖
        working-directory: server
        run: npm ci --no-fund --no-audit

      - name: 运行后端 API 测试
        working-directory: server
        run: npm test

      - name: 安装前端依赖
        working-directory: web
        run: npm ci --no-fund --no-audit

      - name: 构建前端
        working-directory: web
        run: npm run build
